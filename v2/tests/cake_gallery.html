<!DOCTYPE html>
<!-- 蛋糕组合库样张：?seed=起始种子&n=个数。标题写 PASS/FAIL（有 NaN/undefined 或报错即 FAIL）。 -->
<html><head><meta charset="utf-8"><style>body{margin:0;background:#fff7fb;font:11px sans-serif}.g{display:grid;grid-template-columns:repeat(6,160px);gap:4px}.c{background:#fff;border-radius:8px;text-align:center}.c svg{width:150px;height:140px}</style></head><body><div class="g" id="g"></div>
<script src="../mq_gen.js"></script><script src="../mq_scene.js"></script><script src="../mq_cake.js"></script>
<script>
(async () => { const errs = []; window.onerror = m => errs.push(m);
  const rd = f => fetch('../content/' + f).then(r => r.json());
  MQCake.load(await rd('cakes.json')); MQScene.load(await rd('scenes.json'));
  const P = new URLSearchParams(location.search), s0 = +(P.get('seed') || 1), n = +(P.get('n') || 24); let html = '';
  for (let i = 0; i < n; i++) { const sh = P.get('shapes'), s = MQCake.random(s0 + i * 7919, sh ? { shape: sh.split(',')[i % sh.split(',').length] } : {}), svg = MQCake.draw(s); if (/NaN|undefined/.test(svg)) errs.push('bad ' + s.shape); html += `<div class="c">${svg}<div>${MQCake.name(s, 'zh')}</div></div>`; }
  document.getElementById('g').innerHTML = html; document.title = errs.length ? 'FAIL ' + errs.slice(0, 3).join('|') : 'PASS';
})();
</script></body></html>
