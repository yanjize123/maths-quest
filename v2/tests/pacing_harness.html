<!DOCTYPE html>
<!-- 导演实机检查（headless Chrome）：登录后反复“答题计数 + serveNext”，统计 30 题内真实页面出了几次怪兽/事件；标题写 PASS/FAIL 与次数。 -->
<html><head><meta charset="utf-8"></head><body><iframe id="f" src="../index.html?lang=zh" style="width:820px;height:900px;border:0"></iframe>
<script>
const f = document.getElementById('f'), errs = [];
f.onload = async () => {
  const w = f.contentWindow, d = w.document; w.onerror = (m, s, l) => errs.push(m + '@' + l);
  try { w.localStorage.clear(); } catch (e) {}
  d.querySelector('#ll').click(); await new Promise(r => setTimeout(r, 900));
  let ev = 0, mon = 0;
  try {
  for (let q = 0; q < 30; q++) {
    w.eval('MQEv.count(); serveNext()');
    if (w.eval('T.inBeat')) { if (w.eval('T.monster && !T.monsterDone')) { mon++; w.eval('T.monsterDone = true; MQEv.on("battle")'); } else { ev++; w.eval('T.sev.done = true; T.inBeat = false'); } }
  }
  } catch (x) { errs.push(String(x)); }
  document.title = (errs.length || ev + mon < 30 / 4 ? 'FAIL ' + errs.join('|') : 'PASS') + ` 30 题：事件 ${ev}、怪兽 ${mon}`;
};
</script></body></html>
