// opts.onAnswer(value, res) 返回 'accept' | 'reject'（不对称规则在调用处决定）；onDone(finalValue, res)
function ask(itemId, params, opts) {
  const item = C.byItem[itemId], key = opts.key || ('ask:' + itemId + ':' + (T ? T.idx : 0)); if (T) T.seeds = T.seeds || {};
  const seed = opts.seed || (T ? (T.seeds[key] = T.seeds[key] || R(1, 1e9)) : R(1, 1e9));   // 题的种子进入时取一次、存 T.seeds：重画（切换语言）同一道题
  const q = E.instantiate(item, seed, C.mis, { lang: LANG, params, who: params.who });
  if (opts.story) q.story = opts.story;
  const st = { attempt: 1, hint: 0, t0: Date.now(), first: null };
  panel(`<div class="say">${opts.speaker ? `<span class="who">${opts.speaker}:</span> ` : ''}${q.story}</div>
    ${opts.extra || ''}
    <div class="row"><input id="ans" inputmode="numeric" placeholder="${opts.placeholder || '?'}"><button id="ok">${opts.button || 'OK'}</button><button class="alt" id="hb">${t('hint')}</button></div>
    <div id="hints"></div><div class="say" id="msg"></div>`);
  const go = () => {
    const raw = $('ans').value.trim(); if (raw === '') return;
    const v = Number(raw.replace(/[🪙,\s]/g, '')); if (!Number.isFinite(v)) return;
    const res = E.check(q, v, C.mis, item); if (st.attempt === 1) st.first = res.correct && (st.hint === 0 || (T && T.helper && T.helper.bonus === 'hint'));
    res.evidence.forEach(e => ST.evidence.push({ mis_id: e.mis_id, item_id: item.item_id }));
    record(E.makeAttempt({ q, item, content: C, mastery: ST.mastery, answer: v, result: res, attemptNo: st.attempt, hintLevel: st.hint, firstCorrect: st.first, seconds: Math.round((Date.now() - st.t0) / 1000), chosen: !!opts.chosen, reward: opts.reward || '' }));
    if (res.correct && st.first) { ST.streak = (ST.streak || 0) + 1; const bonus = 1 + (ST.streak % 3 === 0 ? 2 : 0) + (T && T.helper && T.helper.bonus === 'berry' ? 1 : 0); ST.stock += bonus; hud(); setTimeout(() => { if ($('msg')) $('msg').insertAdjacentHTML('beforeend', `<div class="note good">${t('berry')(bonus)}</div>`); }, 0); } else if (!res.correct) ST.streak = 0;
    const verdict = res.correct ? 'accept' : opts.onAnswer(v, res, q);
    if (verdict === 'accept') { $('ok').disabled = true; $('ans').disabled = true; opts.onDone(v, res, q, st); return; }
    st.attempt++; const mis = res.evidence[0] && C.mis.find(m => m.mis_id === res.evidence[0].mis_id);
    if (mis) $('msg').innerHTML += `<div class="hint">🤔 ${LANG === 'zh' ? mis.counterexample : (mis.counterexample_en || mis.counterexample)}</div>`;
    if (st.hint < 3) $('hb').click(); $('ans').select();
  };
  $('ok').onclick = go; $('ans').onkeydown = e => { if (e.key === 'Enter') go(); }; $('ans').focus();
  $('hb').onclick = () => { if (st.hint >= 3) return; $('hints').innerHTML += `<div class="hint">💡 ${q.hints[st.hint]}</div>`; st.hint++; if (st.hint >= 3) $('hb').disabled = true; };
  return q;
}

const PALETTES = [{ awning: '#6fd3a8', wall: '#ecfff6' }, { awning: '#f0a35a', wall: '#fff6ea' }, { awning: '#8fb6ff', wall: '#eef4ff' }, { awning: '#c79bff', wall: '#f6efff' }, { awning: '#ff7b7b', wall: '#fff0ee' }, { awning: '#ffd23f', wall: '#fffbe6' }];

function pickEvent() {

  for (const e of EVENTS) { acc += e.p; if (r < acc) { if (e.bad && last && last.bad) return null; if (e.cost && ST.cash < -15) return null; ST.lastEvent = { id: e.id, bad: !!e.bad }; return { ...e }; } }
  ST.lastEvent = null; return null;
}
