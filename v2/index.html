<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Penguin Cupcakes · Maths Quest v2</title>
<!-- 甜品店 第 1 关 页面 v002（2026-11-26 中英切换；v001 首版）：故事线 + 经营线（进货→做蛋糕→收钱→结账→升级→宝箱）。
     规则：business_loop.md（yanjize123/claude 条目 P-20261126-maths-game）。奖惩不对称：对方吃亏的错误被拒绝要重算，对方占便宜的错误被接受、店里亏。 -->
<style>
 :root{--pink:#ff7eb6;--ink:#3a2a3a}
 *{box-sizing:border-box} body{font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif;margin:0;background:#fde9f3;color:var(--ink)}
 .wrap{max-width:820px;margin:0 auto;padding:10px}
 .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border-radius:16px;padding:8px 14px;box-shadow:0 2px 8px #0001}
 .bar b{font-size:20px} .pill{background:#fff4d6;border-radius:20px;padding:4px 12px;font-size:17px} .pill.neg{background:#ffe0e0;color:#b00}
 .stage{position:relative;margin-top:10px;border-radius:18px;overflow:hidden;box-shadow:0 2px 10px #0002;background:#fff}
 .stage .art-scene{display:block;width:100%;height:auto}
 .actors{position:absolute;left:0;right:0;bottom:4%;display:flex;justify-content:space-between;align-items:flex-end;padding:0 6%}
 .actors svg{height:clamp(80px,22vw,150px);width:auto} .actors .art-cake{height:clamp(60px,16vw,110px)}
 .dance{animation:d .5s ease-in-out infinite alternate} @keyframes d{from{transform:rotate(-10deg) translateY(0)}to{transform:rotate(10deg) translateY(-12px)}}
 .big .dance{animation-duration:.3s} .wobble{animation:w .15s 6 alternate} @keyframes w{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
 .card{background:#fff;border-radius:16px;padding:14px 16px;margin-top:10px;box-shadow:0 2px 8px #0001}
 .say{font-size:19px;line-height:1.45} .who{font-weight:700;color:#c2407e}
 button{font-family:inherit;font-size:18px;padding:10px 16px;border-radius:14px;border:0;background:var(--pink);color:#fff;cursor:pointer;margin:4px;box-shadow:0 3px 0 #d55d95}
 button.alt{background:#efe6f5;color:var(--ink);box-shadow:0 3px 0 #cdbfd8} button:disabled{opacity:.45;cursor:default}
 input{font-family:inherit;font-size:22px;padding:8px 10px;border-radius:12px;border:3px solid #f3c6dc;width:150px}
 .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
 .cakes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px} .cakes .c{width:86px;cursor:pointer;background:#fff7fb;border-radius:12px;text-align:center}
 .cakes .c svg{width:86px;height:86px} .hint{background:#eef7ff;border-radius:12px;padding:8px 12px;margin-top:6px}
 .note{font-size:15px;color:#7a6a7a} .good{color:#1d8a4a} .bad{color:#c03a3a}
 .hide{display:none} table{border-collapse:collapse} td{padding:3px 10px}
 .shopitem{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed #eee;padding:6px 0}
</style>
</head>
<body>
<div class="wrap">
 <div id="login" class="card">
  <div class="say" id="lw"></div>
  <div class="row"><input id="lu"><input id="lp" type="password"><button id="lb"></button><button class="alt" id="ll"></button><button class="alt" id="lang1"></button></div>
  <div id="lm" class="note"></div>
 </div>

 <div id="game" class="hide">
  <div class="bar"><b id="btitle"></b><button class="alt" id="lang2" style="font-size:14px;padding:4px 10px"></button><span class="pill" id="cash"></span><span class="pill" id="stock"></span><span class="pill" id="day"></span><span class="note" id="foot"></span></div>
  <div class="stage" id="stage"><div id="bg"></div><div class="actors"><div id="left"></div><div id="mid"></div><div id="right"></div></div></div>
  <div class="card" id="panel"></div>
 </div>
</div>

<script src="config.js"></script>
<script src="rules.js"></script>
<script src="mq_engine.js"></script>
<script src="mq_store.js"></script>
<script src="mq_art.js"></script>
<script>
const PAGE_VERSION = 2, E = MQEngine, A = MQArt, $ = id => document.getElementById(id), QKEY = 'mq_v2_queue';
const DRAGONS = ['Pink Fluffy Unicorn', 'Yummy', 'Sprinkle'];
const PUNNET = 10;                 // 每盒草莓 10 颗

let C, S, ST, T, flushing = false;
let LANG = new URLSearchParams(location.search).get('lang') || (() => { try { return localStorage.getItem('mq_v2_lang'); } catch (e) { return null; } })() || 'en';
const TX = {
 en: { title:'Penguin Cupcakes', welcome:'🐧 Welcome to <b>Penguin Cupcakes</b>! Log in with your Maths Quest v2 name and password.', name:'name', pass:'password', open:'Open the shop', guest:'Play without saving', needpw:'Type your name and password.', unlocking:'Unlocking the shop door…', noserver:'Cannot reach the server. Check the internet and try again.', loginfail:'Could not log in',
  loan:' (bank loan)', day:'Day', hint:'💡 Hint', penguin:'Penguin', farmer:'Farmer Fox', owl:'Owl the accountant',
  morning:"Good morning! Here are today's orders:", lots:'some cupcakes with lots of strawberries', ord:(n,k)=>`${n} cupcakes, ${k} strawberries on each`,
  have:(s,P,p)=>`You have <b>🍓 ${s}</b> strawberries. The market sells punnets of <b>${P}</b> strawberries for <b>£${p}</b> each.`, howmany:'How many punnets?', market:'Go to the market', noshop:'No shopping today', tip:'Tip: work out how many strawberries the orders need before you buy!',
  pay:'Pay', notenough:'🦊 "That\'s not enough money!" Try again.', kept:d=>`🦊 "Thank you!" The farmer kept the extra <b>£${d}</b>. Oops — you paid too much.`, exact:'🦊 "Exactly right, thank you!"', opennow:'Open the shop 🔔',
  wants:(n,k)=>`I'd like ${n} cupcakes with ${k} strawberries on each, please!`, nostock:(s,w)=>`🐧 Oh no — we only have 🍓 ${s}. Not enough strawberries! ${w} goes home sad.`, nextc:'Next customer',
  tap:'Tap a cupcake to add a strawberry, then type how many you used.', again:'🔄 start again', bake:'Bake!', toofew:w=>`🫠 Not enough strawberries — that's not what ${w} ordered! Bake it again.`, toomany:(w,d)=>`${w} is happy, but you used <b>${d}</b> strawberries too many.`,
  perfect:w=>`🌈 Perfect! ${w} does the big rainbow dance!`, yum:w=>`Yum! ${w} does a little dance.`, takemoney:'Take the money 💷', charge:'Charge', toomuch:w=>`${w}: "That's too much! I'm not paying that." Check again.`, toolittle:(w,d)=>`${w} pays happily… but you charged <b>£${d}</b> too little!`, kaching:v=>`💷 Ka-ching! +£${v}`, close:'Close the shop 🌙',
  check:'Check', profitq:(a,b)=>`Today you took £${a} and spent £${b} on strawberries. How much profit did you make?`, lossq:(a,b)=>`Today you spent £${b} on strawberries but only took £${a}. How much money did you lose?`, owlagain:'🦉 "Hoo! Let\'s check that again."',
  owlok:(p,v)=>`🦉 "Correct! ${p ? 'You made £' + v : 'You lost £' + v} today."`, served:'Customers served', left:'Customers who left', till:'Money in the till', stockleft:'Strawberries left', loannote:'Your money is below zero, so Penguin Bank lent you some. Make a profit to pay it back!', pickchest:'🎁 Pick a chest', upg:'🛠 Shop upgrades',
  whatbuy:c=>`What shall we buy for the shop? You have ${c}.`, use:'Use', buy:'Buy', normal:'Normal shop', chestq:'Pick a chest! Better chests have harder questions.', bronze:'🥉 Bronze', silver:'🥈 Silver', gold:'🥇 Gold', openq:'Open!', locked:'The chest is still locked. Try again!',
  opened:(t,v)=>`🎉 The ${t} chest opens: +£${v}!`, became:t=>`(It became a ${t} chest because it took more than one try.)`, sleep:'Sleep 😴 → next day', waiting:n=>`⏳ ${n} waiting to upload`, saved:'✓ saved', other:'中文',
  U:{ sign:['🌈 Rainbow sign','Cupcakes sell for £1 more.'], oven:['🔥 Bigger oven','One more customer every day.'], space:['🚀 Space shop','Move the shop to outer space!'], sea:['🐠 Seaside shop','A shop by the sea.'] } },
 zh: { title:'企鹅纸杯蛋糕店', welcome:'🐧 欢迎来到<b>企鹅纸杯蛋糕店</b>！用你的 Maths Quest v2 名字和密码登录。', name:'名字', pass:'密码', open:'开店', guest:'不保存，直接玩', needpw:'请输入名字和密码。', unlocking:'正在打开店门……', noserver:'连不上服务器，请检查网络后再试。', loginfail:'登录失败',
  loan:'（向银行借的）', day:'第', hint:'💡 提示', penguin:'企鹅', farmer:'狐狸农夫', owl:'猫头鹰会计',
  morning:'早上好！今天的订单是：', lots:'一些蛋糕，要放很多草莓', ord:(n,k)=>`${n} 个蛋糕，每个放 ${k} 颗草莓`,
  have:(s,P,p)=>`你现在有 <b>🍓 ${s}</b> 颗草莓。市场上的草莓每盒 <b>${P}</b> 颗，每盒 <b>£${p}</b>。`, howmany:'买几盒？', market:'去市场', noshop:'今天不进货', tip:'小窍门：先算算这些订单一共要多少颗草莓，再决定买几盒！',
  pay:'付钱', notenough:'🦊“钱不够哦！”再算一算。', kept:d=>`🦊“谢谢！”农夫把多给的 <b>£${d}</b> 收下了。哎呀，你多付了。`, exact:'🦊“刚刚好，谢谢！”', opennow:'开门营业 🔔',
  wants:(n,k)=>`我要 ${n} 个蛋糕，每个放 ${k} 颗草莓！`, nostock:(s,w)=>`🐧 糟糕，我们只有 🍓 ${s} 颗，草莓不够！${w} 只好伤心地回家了。`, nextc:'下一位顾客',
  tap:'点蛋糕可以放一颗草莓，放好后填一共用了几颗。', again:'🔄 重新放', bake:'做蛋糕！', toofew:w=>`🫠 草莓放少了，不是 ${w} 要的蛋糕！重新做。`, toomany:(w,d)=>`${w} 很高兴，可是你多用了 <b>${d}</b> 颗草莓。`,
  perfect:w=>`🌈 太棒了！${w} 跳起了大彩虹舞！`, yum:w=>`真好吃！${w} 跳了一小段舞。`, takemoney:'收钱 💷', charge:'收钱', toomuch:w=>`${w}：“太贵了！我不付这么多。”再算一算。`, toolittle:(w,d)=>`${w} 高高兴兴地付了钱……可是你少收了 <b>£${d}</b>！`, kaching:v=>`💷 叮！+£${v}`, close:'关门 🌙',
  check:'核对', profitq:(a,b)=>`今天收入 £${a}，进草莓花了 £${b}。今天赚了多少镑？`, lossq:(a,b)=>`今天进草莓花了 £${b}，只收入 £${a}。今天亏了多少镑？`, owlagain:'🦉“咕咕！我们再核对一遍。”',
  owlok:(p,v)=>`🦉“对了！今天${p ? '赚了' : '亏了'} £${v}。”`, served:'服务的顾客', left:'没买到走掉的顾客', till:'钱箱里的钱', stockleft:'剩下的草莓', loannote:'钱变成负数了，企鹅银行借给你一些。多赚点钱把它还上吧！', pickchest:'🎁 选一个宝箱', upg:'🛠 装修店铺',
  whatbuy:c=>`给店里买点什么呢？你有 ${c}。`, use:'使用', buy:'买', normal:'普通店面', chestq:'选一个宝箱！越好的宝箱，题目越难。', bronze:'🥉 铜宝箱', silver:'🥈 银宝箱', gold:'🥇 金宝箱', openq:'打开！', locked:'宝箱还锁着，再试一次！',
  opened:(t,v)=>`🎉 ${{bronze:'铜',silver:'银',gold:'金'}[t]}宝箱打开了：+£${v}！`, became:t=>`（试了不止一次，所以变成了${{bronze:'铜',silver:'银',gold:'金'}[t]}宝箱。）`, sleep:'睡觉 😴 → 第二天', waiting:n=>`⏳ ${n} 条等待上传`, saved:'✓ 已保存', other:'English',
  U:{ sign:['🌈 彩虹招牌','每个蛋糕多卖 £1。'], oven:['🔥 大烤箱','每天多来一位顾客。'], space:['🚀 太空店','把店搬到太空去！'], sea:['🐠 海边店','开在海边的店。'] } } };
const t = k => TX[LANG][k];
function setLang(l) { LANG = l; try { localStorage.setItem('mq_v2_lang', l); } catch (e) {} document.documentElement.lang = l === 'zh' ? 'zh-Hans' : 'en'; document.title = t('title') + ' · Maths Quest v2'; }   // C 内容、S 会话、ST 存档、T 今天的临时状态

const read = p => fetch(p, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(p); return r.text(); });
async function post(b) { const r = await fetch(BACKEND_V2, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(b) }); return r.json(); }
const qGet = () => { try { return JSON.parse(localStorage.getItem(QKEY)) || []; } catch (e) { return []; } };
const qSet = q => { try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch (e) {} };
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const money = v => (v < 0 ? '−£' : '£') + Math.abs(v);
function newShop() { return { v: 1, cash: 20, day: 1, stock: 0, mastery: {}, evidence: [], upgrades: [], chests: [], history: [] }; }

// ---------------- 登录 ----------------
$('lb').onclick = async () => {
  const user = $('lu').value.trim(), pass = $('lp').value; if (!user || !pass) { $('lm').textContent = t('needpw'); return; }
  $('lb').disabled = true; $('lm').textContent = t('unlocking');
  try {
    const r = await post({ action: 'login', user, pass, device: 'v2-shop · ' + navigator.userAgent }); $('lb').disabled = false;
    if (!r.ok) { $('lm').textContent = r.err || t('loginfail'); return; }
    S = { user, pass, name: r.name, session: r.session };
    const local = MQStore.loadProgress(r.name), remote = r.state && r.state.v ? r.state : null;
    ST = (!remote || (local && local.day > remote.day)) ? (local || newShop()) : remote; boot();
  } catch (e) { $('lb').disabled = false; $('lm').textContent = t('noserver'); }
};
function renderLogin() { setLang(LANG); $('lw').innerHTML = t('welcome'); $('lu').placeholder = t('name'); $('lp').placeholder = t('pass'); $('lb').textContent = t('open'); $('ll').textContent = t('guest'); $('lang1').textContent = t('other'); }
$('lang1').onclick = () => { setLang(LANG === 'zh' ? 'en' : 'zh'); renderLogin(); };
$('lang2').onclick = () => { setLang(LANG === 'zh' ? 'en' : 'zh'); morning(); };
renderLogin();
$('ll').onclick = () => { S = { name: 'guest', local: true }; ST = MQStore.loadProgress('guest') || newShop(); boot(); };

async function boot() {
  C = await E.loadContent(read, [1, 'level01biz']);
  $('login').classList.add('hide'); $('game').classList.remove('hide'); morning();
}

// ---------------- 画面 ----------------
function hud() {
  $('cash').textContent = '💷 ' + money(ST.cash) + (ST.cash < 0 ? t('loan') : ''); $('cash').className = 'pill' + (ST.cash < 0 ? ' neg' : '');
  $('stock').textContent = '🍓 ' + ST.stock; $('day').textContent = LANG === 'zh' ? `📅 第 ${ST.day} 天` : '📅 Day ' + ST.day; $('btitle').textContent = '🧁 ' + t('title'); $('lang2').textContent = t('other');
  const theme = ST.upgrades.includes('space') && ST.theme === 'space' ? 'space' : ST.upgrades.includes('sea') && ST.theme === 'sea' ? 'sea' : 'shop';
  $('bg').innerHTML = A.scene(theme);
}
function actors(left, mid, right) { $('left').innerHTML = left || ''; $('mid').innerHTML = mid || ''; $('right').innerHTML = right || ''; }
function panel(html) { $('panel').innerHTML = html; }
function dance(el, big) { el.firstElementChild?.classList.add('dance'); $('stage').classList.toggle('big', !!big); }

// ---------------- 一道“孩子必须算的题”（通用） ----------------
// opts.onAnswer(value, res) 返回 'accept' | 'reject'（不对称规则在调用处决定）；onDone(finalValue, res)
function ask(itemId, params, opts) {
  const item = C.byItem[itemId], seed = R(1, 1e9);
  const q = E.instantiate(item, seed, C.mis, { lang: LANG, params, who: params.who });
  if (opts.story) q.story = opts.story;
  const st = { attempt: 1, hint: 0, t0: Date.now(), first: null };
  panel(`<div class="say">${opts.speaker ? `<span class="who">${opts.speaker}:</span> ` : ''}${q.story}</div>
    ${opts.extra || ''}
    <div class="row"><input id="ans" inputmode="numeric" placeholder="${opts.placeholder || '£?'}"><button id="ok">${opts.button || 'OK'}</button><button class="alt" id="hb">${t('hint')}</button></div>
    <div id="hints"></div><div class="say" id="msg"></div>`);
  const go = () => {
    const raw = $('ans').value.trim(); if (raw === '') return;
    const v = Number(raw.replace(/[£,\s]/g, '')); if (!Number.isFinite(v)) return;
    const res = E.check(q, v, C.mis, item); if (st.attempt === 1) st.first = res.correct && st.hint === 0;
    res.evidence.forEach(e => ST.evidence.push({ mis_id: e.mis_id, item_id: item.item_id }));
    record(E.makeAttempt({ q, item, content: C, mastery: ST.mastery, answer: v, result: res, attemptNo: st.attempt, hintLevel: st.hint, firstCorrect: st.first, seconds: Math.round((Date.now() - st.t0) / 1000), chosen: !!opts.chosen, reward: opts.reward || '' }));
    const verdict = res.correct ? 'accept' : opts.onAnswer(v, res, q);
    if (verdict === 'accept') { $('ok').disabled = true; $('ans').disabled = true; opts.onDone(v, res, q, st); return; }
    st.attempt++; const mis = res.evidence[0] && C.mis.find(m => m.mis_id === res.evidence[0].mis_id);
    if (mis) $('msg').innerHTML += `<div class="hint">🤔 ${LANG === 'zh' ? mis.counterexample : (mis.counterexample_en || mis.counterexample)}</div>`;
    if (st.hint < 3) $('hb').click(); $('ans').select();
  };
  $('ok').onclick = go; $('ans').onkeydown = e => { if (e.key === 'Enter') go(); }; $('ans').focus();
  $('hb').onclick = () => { if (st.hint >= 3) return; $('hints').innerHTML += `<div class="hint">💡 ${q.hints[st.hint]}</div>`; st.hint++; if (st.hint >= 3) $('hb').disabled = true; };
  return q;
}

// ---------------- 1 早上：看订单预告、进货 ----------------
function morning() {
  hud(); const nCust = 3 + (ST.upgrades.includes('oven') ? 1 : 0);
  const orders = Array.from({ length: nCust }, (_, i) => {
    const who = DRAGONS[(ST.day + i) % 3], kind = ['IT.L1.MUL.001', 'IT.L1.MUL.003', 'IT.L1.MUL.007'][R(0, 2)];
    const p = kind === 'IT.L1.MUL.003' ? { n: 10, k: R(2, 4) } : kind === 'IT.L1.MUL.001' ? { n: R(2, 5), k: R(2, 5) } : { n: R(3, 6), k: R(2, 4) };
    return { who, kind, p };
  });
  const price = R(2, 4);
  T = { orders, idx: 0, price, cakePrice: ST.upgrades.includes('sign') ? 3 : 2, income: 0, spent: 0, punnets: 0, lost: 0, served: 0 };
  actors(A.penguin(), '', A.dragon(orders[0].who));
  const list = orders.map(o => `<li>${o.who}: ${o.kind === 'IT.L1.MUL.007' ? t('lots') : t('ord')(o.p.n, o.p.k)}</li>`).join('');
  panel(`<div class="say"><span class="who">${t('penguin')}:</span> ${t('morning')}</div><ul class="say">${list}</ul>
    <div class="say">${t('have')(ST.stock, PUNNET, price)}</div>
    <div class="row">${t('howmany')} <button class="alt" id="minus">−</button><b id="pn" style="font-size:24px">1</b><button class="alt" id="plus">+</button><button id="buy">${t('market')}</button><button class="alt" id="skip">${t('noshop')}</button></div>
    <div class="note">${t('tip')}</div>`);
  let n = 1; const show = () => $('pn').textContent = n;
  $('minus').onclick = () => { n = Math.max(1, n - 1); show(); }; $('plus').onclick = () => { n = Math.min(8, n + 1); show(); };
  $('skip').onclick = () => serveNext();
  $('buy').onclick = () => pay(n);
}

function pay(n) {
  const correct = n * T.price; T.punnets = n;
  actors(A.penguin(), '', '<div style="font-size:70px">🧑‍🌾</div>');
  ask('IT.L1.BIZ.BUY', { n, k: T.price }, {
    speaker: t('farmer'), button: t('pay'),
    onAnswer: v => {
      if (v < correct) { $('msg').innerHTML = `<span class="bad">${t('notenough')}</span>`; return 'reject'; }
      $('msg').innerHTML = `<span class="bad">${t('kept')(v - correct)}</span>`; return 'accept';
    },
    onDone: v => {
      ST.cash -= v; T.spent += v; ST.stock += n * PUNNET; hud();
      if (v === correct) $('msg').innerHTML = `<span class="good">${t('exact')}</span>`;
      $('msg').innerHTML += `<div class="row"><button id="nx">${t('opennow')}</button></div>`; $('nx').onclick = serveNext;
    }
  });
}

// ---------------- 2 营业：做蛋糕、收钱 ----------------
function serveNext() {
  hud(); if (T.idx >= T.orders.length) return evening();
  const o = T.orders[T.idx], item = C.byItem[o.kind], need = E.evalExpr(item.answer, o.p);
  actors(A.penguin(), A.cupcake(0), A.dragon(o.who));
  if (need > ST.stock) {
    panel(`<div class="say"><span class="who">${o.who}:</span> ${t('wants')(o.p.n, o.p.k)}</div>
      <div class="say bad">${t('nostock')(ST.stock, o.who)}</div><div class="row"><button id="nx">${t('nextc')}</button></div>`);
    actors(A.penguin('oops'), A.cupcake(0), A.dragon(o.who, 'sad')); T.lost++; T.idx++; $('nx').onclick = serveNext; return;
  }
  const extra = item.action === 'drag' ? `<div class="note">${t('tap')}</div><div class="cakes" id="cakes"></div><button class="alt" id="reset">${t('again')}</button>` : '';
  let placed = Array(o.p.n).fill(0);
  ask(o.kind, { ...o.p, who: o.who }, {
    speaker: o.who, button: t('bake'), placeholder: '🍓 ?', extra,
    onAnswer: (v, res) => {
      if (v < need) { actors(A.penguin('oops'), A.cupcake(0, true), A.dragon(o.who, 'sad')); $('stage').classList.add('wobble'); setTimeout(() => $('stage').classList.remove('wobble'), 900);
        $('msg').innerHTML = `<span class="bad">${t('toofew')(o.who)}</span>`; return 'reject'; }
      $('msg').innerHTML = `<span class="bad">${t('toomany')(o.who, v - need)}</span>`; return 'accept';
    },
    onDone: (v, res, q, st) => {
      ST.stock -= Math.min(v, ST.stock); hud();
      actors(A.penguin(), A.cupcake(Math.min(o.p.k, 8)), A.dragon(o.who)); dance($('right'), st.first);
      if (v === need) $('msg').innerHTML = `<span class="good">${st.first ? t('perfect')(o.who) : t('yum')(o.who)}</span>`;
      $('msg').innerHTML += `<div class="row"><button id="nx">${t('takemoney')}</button></div>`; $('nx').onclick = () => charge(o);
    }
  });
  if (item.action === 'drag') {
    const draw = () => { $('cakes').innerHTML = placed.map((c, i) => `<div class="c" data-i="${i}">${A.cupcake(c)}</div>`).join(''); };
    draw(); $('cakes').onclick = e => { const el = e.target.closest('.c'); if (!el) return; placed[+el.dataset.i]++; draw(); };
    $('reset').onclick = () => { placed.fill(0); draw(); };
  }
}

function charge(o) {
  const correct = o.p.n * T.cakePrice;
  ask('IT.L1.BIZ.CHARGE', { n: o.p.n, k: T.cakePrice, who: o.who }, {
    speaker: t('penguin'), button: t('charge'),
    onAnswer: v => {
      if (v > correct) { $('msg').innerHTML = `<span class="bad">${t('toomuch')(o.who)}</span>`; return 'reject'; }
      $('msg').innerHTML = `<span class="bad">${t('toolittle')(o.who, correct - v)}</span>`; return 'accept';
    },
    onDone: v => {
      ST.cash += v; T.income += v; T.served++; hud();
      if (v === correct) $('msg').innerHTML = `<span class="good">${t('kaching')(v)}</span>`;
      T.idx++; $('msg').innerHTML += `<div class="row"><button id="nx">${T.idx < T.orders.length ? t('nextc') : t('close')}</button></div>`; $('nx').onclick = serveNext;
    }
  });
}

// ---------------- 3 晚上：结账 ----------------
function evening() {
  actors(A.penguin(), '', '<div style="font-size:70px">🦉</div>');
  const a = T.income, b = T.spent, profit = a >= b;
  ask('IT.L1.BIZ.PROFIT', profit ? { a, b } : { a: b, b: a }, {
    speaker: t('owl'), button: t('check'),
    story: profit ? t('profitq')(a, b) : t('lossq')(a, b),
    onAnswer: () => { $('msg').innerHTML = `<span class="bad">${t('owlagain')}</span>`; return 'reject'; },
    onDone: () => {
      ST.history.push({ day: ST.day, income: a, spent: b, served: T.served, lost: T.lost });
      $('msg').innerHTML = `<span class="good">${t('owlok')(profit, Math.abs(a - b))}</span>
        <table class="say"><tr><td>${t('served')}</td><td>${T.served}</td></tr><tr><td>${t('left')}</td><td>${T.lost}</td></tr><tr><td>${t('till')}</td><td>${money(ST.cash)}</td></tr><tr><td>${t('stockleft')}</td><td>🍓 ${ST.stock}</td></tr></table>
        ${ST.cash < 0 ? `<div class="note">${t('loannote')}</div>` : ''}
        <div class="row"><button id="nx">${t('pickchest')}</button><button class="alt" id="up">${t('upg')}</button></div>`;
      $('nx').onclick = chest; $('up').onclick = upgrades; save();
    }
  });
}

// ---------------- 4 升级 ----------------
function upgrades() {
  actors(A.penguin(), '', ''); const own = ST.upgrades;
  panel(`<div class="say"><span class="who">${t('penguin')}:</span> ${t('whatbuy')(money(ST.cash))}</div>
    ${UPGRADES.map(u => `<div class="shopitem"><span>${t('U')[u.id][0]} — £${u.cost}<br><span class="note">${t('U')[u.id][1]}</span></span>${own.includes(u.id) ? (u.id === 'space' || u.id === 'sea' ? `<button class="alt" data-theme="${u.id}">${t('use')}</button>` : '<span class="good">✓</span>') : `<button data-buy="${u.id}" ${ST.cash < u.cost ? 'disabled' : ''}>${t('buy')}</button>`}</div>`).join('')}
    ${own.includes('space') || own.includes('sea') ? `<button class="alt" data-theme="shop">${t('normal')}</button>` : ''}
    <div class="row"><button id="nx">${t('pickchest')}</button></div>`);
  $('panel').querySelectorAll('[data-buy]').forEach(b => b.onclick = () => { const u = UPGRADES.find(x => x.id === b.dataset.buy); ST.cash -= u.cost; ST.upgrades.push(u.id); if (u.id === 'space' || u.id === 'sea') ST.theme = u.id; save(); hud(); upgrades(); });
  $('panel').querySelectorAll('[data-theme]').forEach(b => b.onclick = () => { ST.theme = b.dataset.theme; save(); hud(); });
  $('nx').onclick = chest;
}

// ---------------- 5 宝箱：自选档次，答对得奖，答错降一档 ----------------
function chest() {
  actors(A.penguin(), '<div style="font-size:80px">🎁</div>', A.dragon(DRAGONS[ST.day % 3]));
  panel(`<div class="say">${t('chestq')}</div><div class="row"><button data-t="bronze">${t('bronze')} (£2)</button><button data-t="silver">${t('silver')} (£5)</button><button data-t="gold">${t('gold')} (£10)</button></div>`);
  $('panel').querySelectorAll('[data-t]').forEach(b => b.onclick = () => openChest(b.dataset.t));
}
function openChest(tier) {
  const VAL = { bronze: 2, silver: 5, gold: 10 }, DOWN = { gold: 'silver', silver: 'bronze', bronze: 'bronze' };
  const band = { bronze: [0, 0.3], silver: [0.3, 0.45], gold: [0.45, 1] }[tier];
  const pool = C.items.filter(i => i.level === 1 && !i.item_id.includes('BIZ') && i.action !== 'drag' && i.action !== 'choose' && i.action !== 'judge' && i.difficulty >= band[0] && i.difficulty <= band[1]);
  const item = pool[R(0, pool.length - 1)] || C.byItem['IT.L1.MUL.005'];
  let wrong = false;
  ask(item.item_id, { who: DRAGONS[R(0, 2)] }, {
    speaker: '🎁', button: t('openq'), chosen: true, reward: tier, placeholder: '?',
    onAnswer: () => { wrong = true; $('msg').innerHTML = `<span class="bad">${t('locked')}</span>`; return 'reject'; },
    onDone: () => {
      const got = wrong ? DOWN[tier] : tier; ST.cash += VAL[got]; ST.chests.push({ tier: got, day: ST.day }); hud();
      $('msg').innerHTML = `<span class="good">${t('opened')(got, VAL[got])}</span>${wrong && got !== tier ? `<div class="note">${t('became')(got)}</div>` : ''}<div class="row"><button id="nx">${t('sleep')}</button></div>`;
      $('nx').onclick = () => { ST.day++; save(); morning(); };
    }
  });
}

// ---------------- 存档与上传 ----------------
function save() { ST.evidence = ST.evidence.slice(-200); ST.history = ST.history.slice(-60); MQStore.saveProgress(S.name, ST); flush(); }
function record(row) {
  if (S.local || !BACKEND_V2) return;
  const a = qGet(); a.push({ id: Math.random().toString(36).slice(2), user: S.name, session: S.session, time: new Date().toISOString(), mode: 'v2-shop', year: '', area: 'calculation', topic: row.skills_snapshot, type: row.item_id, hint: row.hint_level > 0 ? 1 : 0, ...row }); qSet(a); flush();
}
async function flush() {
  if (!S || S.local || flushing) return; const mine = qGet().filter(e => e.user === S.name); flushing = true;
  try { const r = await post({ action: 'log', user: S.user, pass: S.pass, events: mine, state: ST }); if (r.ok) { const ids = new Set(mine.map(e => e.id)); qSet(qGet().filter(e => !ids.has(e.id))); } } catch (e) {}
  flushing = false; const n = qGet().filter(e => e.user === S.name).length; $('foot').textContent = n ? t('waiting')(n) : t('saved');
}
</script>
</body>
